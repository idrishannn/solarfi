[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "solarfi"
version = "1.0.0"
description = "Project-finance model for utility-scale solar PV, with a Streamlit front end"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["solar", "pv", "project-finance", "renewable-energy", "lcoe", "dscr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = ["pandas>=2.0", "numpy>=1.24", "openpyxl>=3.1"]

[project.optional-dependencies]
app = ["streamlit>=1.49,<2.0", "altair>=5.0"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "numpy-financial>=1.0", "streamlit>=1.49,<2.0"]

[tool.setuptools.packages.find]
include = ["solarfi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "ui: Streamlit arayüzünü AppTest ile çalıştıran testler (yavaş). Atlamak için: -m 'not ui'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"examples/*" = ["E402"]
